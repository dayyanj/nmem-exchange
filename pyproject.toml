[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nmem-exchange"
version = "0.3.0"
description = "Pluggable, end-to-end-secured message bus for nmem agents"
requires-python = ">=3.11"
dependencies = [
    "pynacl>=1.5.0",
    "redis[hiredis]>=5.0.0",
]

[project.optional-dependencies]
# The read-only room observer (dashboard + persistent, searchable history). The core bus needs
# neither a web server nor YAML; the observer pulls them in only when you run it.
observer = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
]

[project.scripts]
nmem-exchange-observer = "nmem_exchange.observer.__main__:main"

[tool.setuptools.packages.find]
include = ["nmem_exchange*"]

[tool.setuptools.package-data]
nmem_exchange = ["observer/dashboard.html"]
